<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
  <title id="t">The whole stack, top to bottom</title>
  <desc id="d">Six layers. You, the CEO, at the top. Your departments. Life OS, the job description, lit in sage. Then the parts your AI app already brings: an AI bot that stays on with its own computer, an AI agent with memory and tools, and the AI model, the brain.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12151a"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g font-family="Rajdhani, system-ui, sans-serif" font-size="16" fill="#9aa2ac" letter-spacing="2.5">
    <text x="110" y="92">WHO BRINGS IT</text>
    <text x="330" y="92">LAYER</text>
    <text x="700" y="92">WHAT IT IS, IN PLAIN WORDS</text>
  </g>
  <g font-family="Rajdhani, system-ui, sans-serif">
    <g transform="translate(0,110)">
      <rect x="310" y="0" width="780" height="70" rx="14" fill="#12151a" stroke="#6F9D80" stroke-width="2"/>
      <text x="110" y="42" font-size="16" fill="#9aa2ac" letter-spacing="2">YOU</text>
      <text x="335" y="32" font-size="26" font-weight="700" fill="#ffffff">You</text><text x="335" y="56" font-size="15" fill="#9aa2ac">the CEO</text>
      <text x="700" y="43" font-size="18" fill="#e6e9ee">You say yes or no. Paying stays with you.</text>
    </g>
    <g transform="translate(0,190)">
      <rect x="310" y="0" width="780" height="70" rx="14" fill="#12151a" stroke="rgba(255,255,255,0.12)"/>
      <text x="110" y="42" font-size="16" fill="#8FBF9F" letter-spacing="2">LIFE OS</text>
      <text x="335" y="32" font-size="26" font-weight="700" fill="#ffffff">Your departments</text><text x="335" y="56" font-size="15" fill="#9aa2ac">Money, Health, Home, Taxes, and the rest</text>
      <text x="700" y="43" font-size="18" fill="#e6e9ee">Each one knows what good looks like and what to watch.</text>
    </g>
    <g transform="translate(0,270)" filter="url(#glow)">
      <rect x="310" y="0" width="780" height="70" rx="14" fill="rgba(143,191,159,0.16)" stroke="#8FBF9F" stroke-width="3"/>
      <text x="110" y="42" font-size="16" fill="#8FBF9F" letter-spacing="2">LIFE OS</text>
      <text x="335" y="32" font-size="26" font-weight="700" fill="#ffffff">Life OS</text><text x="335" y="56" font-size="15" fill="#9aa2ac">the job description</text>
      <text x="700" y="43" font-size="18" fill="#e6e9ee">Safety rules, one Brief a week, departments, Oversight. Text. Free.</text>
    </g>
    <g transform="translate(0,350)">
      <rect x="310" y="0" width="780" height="70" rx="14" fill="#12151a" stroke="rgba(255,255,255,0.12)"/>
      <text x="110" y="42" font-size="16" fill="#9aa2ac" letter-spacing="2">YOUR AI APP</text>
      <text x="335" y="32" font-size="26" font-weight="700" fill="#ffffff">An AI bot</text><text x="335" y="56" font-size="15" fill="#9aa2ac">always on, with its own computer</text>
      <text x="700" y="43" font-size="18" fill="#e6e9ee">Works while you sleep. Messages you first. Muse, Grok Bot.</text>
    </g>
    <g transform="translate(0,430)">
      <rect x="310" y="0" width="780" height="70" rx="14" fill="#12151a" stroke="rgba(255,255,255,0.12)"/>
      <text x="110" y="42" font-size="16" fill="#9aa2ac" letter-spacing="2">YOUR AI APP</text>
      <text x="335" y="32" font-size="26" font-weight="700" fill="#ffffff">An AI agent</text><text x="335" y="56" font-size="15" fill="#9aa2ac">memory, tools, a schedule</text>
      <text x="700" y="43" font-size="18" fill="#e6e9ee">Remembers you. Reads your calendar, read-only, if you let it.</text>
    </g>
    <g transform="translate(0,510)">
      <rect x="310" y="0" width="780" height="70" rx="14" fill="#12151a" stroke="rgba(255,255,255,0.12)"/>
      <text x="110" y="42" font-size="16" fill="#9aa2ac" letter-spacing="2">YOUR AI APP</text>
      <text x="335" y="32" font-size="26" font-weight="700" fill="#ffffff">An AI model</text><text x="335" y="56" font-size="15" fill="#9aa2ac">the brain</text>
      <text x="700" y="43" font-size="18" fill="#e6e9ee">Reads and writes. Alone, it answers and forgets.</text>
    </g>
  </g>
  <text x="600" y="640" text-anchor="middle" font-family="Rajdhani, system-ui, sans-serif" font-size="17" fill="#9aa2ac">Life OS is the one layer nobody ships. It costs nothing because it is text, and the app you already use does the work.</text>
</svg>
