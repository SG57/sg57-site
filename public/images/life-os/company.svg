<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-labelledby="t d">
  <title id="t">Your life as a company</title>
  <desc id="d">You are the CEO at the top. Your assistant is the back office in the middle. Below it, departments: Money, Protection, Health, Home, Paperwork, Pets, and Good Life. They talk to each other. One short report rises to you each week.</desc>
  <style>
    .box{fill:#12151a;stroke:#2a3040;stroke-width:2}
    .ceo{stroke:#8FBF9F;stroke-width:2.5}
    .office{stroke:#9aa2ac}
    .good{stroke:#8FBF9F;stroke-dasharray:6 5}
    .h{fill:#ffffff;font:700 22px Rajdhani,system-ui,sans-serif;text-anchor:middle}
    .s{fill:#9aa2ac;font:14px Rajdhani,system-ui,sans-serif;text-anchor:middle}
    .dpt{fill:#ffffff;font:600 16px Rajdhani,system-ui,sans-serif;text-anchor:middle}
    .g{fill:#8FBF9F}
    .tiny{fill:#9aa2ac;font:12px Rajdhani,system-ui,sans-serif;text-anchor:middle}
    .chip{fill:#6F9D80;opacity:.75}
    .link{fill:none;stroke:#2a3040;stroke-width:2}
    .up{stroke:#8FBF9F;stroke-width:2.5}
    .dots{fill:none;stroke:#6F9D80;stroke-width:2;stroke-dasharray:3 5}
  </style>
  <rect x="360" y="20" width="200" height="56" rx="12" class="box ceo"/>
  <text x="460" y="44" class="h">You</text><text x="460" y="64" class="s">the CEO · reads one report a week</text>
  <rect x="430" y="120" width="60" height="40" rx="6" fill="#8FBF9F"/><path d="M430 124l30 22 30-22" fill="none" stroke="#0a0c10" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="500" y="146" class="tiny" text-anchor="start">the Brief</text>
  <line x1="460" y1="176" x2="460" y2="86" class="link up"/>
  <rect x="300" y="176" width="320" height="60" rx="12" class="box office"/>
  <text x="460" y="200" class="h">Your assistant</text><text x="460" y="222" class="s">the back office · notices, plans, prepares</text>
  <g class="link"><path d="M460 236v30H90v30"/><path d="M460 236v30H215v30"/><path d="M460 236v30H340v30"/><path d="M460 236v60"/><path d="M460 236v30H580v30"/><path d="M460 236v30H705v30"/><path d="M460 236v30H830v30"/></g>
  <g transform="translate(40 296)"><rect width="100" height="92" rx="10" class="box"/><text x="50" y="30" class="dpt">Money</text><rect x="12" y="44" width="76" height="8" rx="4" class="chip"/><rect x="12" y="58" width="56" height="8" rx="4" class="chip"/><rect x="12" y="72" width="66" height="8" rx="4" class="chip"/></g>
  <g transform="translate(165 296)"><rect width="100" height="92" rx="10" class="box"/><text x="50" y="30" class="dpt">Protection</text><rect x="12" y="44" width="76" height="8" rx="4" class="chip"/><rect x="12" y="58" width="48" height="8" rx="4" class="chip"/><rect x="12" y="72" width="70" height="8" rx="4" class="chip"/></g>
  <g transform="translate(290 296)"><rect width="100" height="92" rx="10" class="box"/><text x="50" y="30" class="dpt">Health</text><rect x="12" y="44" width="60" height="8" rx="4" class="chip"/><rect x="12" y="58" width="76" height="8" rx="4" class="chip"/><rect x="12" y="72" width="40" height="8" rx="4" class="chip"/></g>
  <g transform="translate(410 296)"><rect width="100" height="92" rx="10" class="box"/><text x="50" y="30" class="dpt">Home</text><rect x="12" y="44" width="70" height="8" rx="4" class="chip"/><rect x="12" y="58" width="52" height="8" rx="4" class="chip"/><rect x="12" y="72" width="76" height="8" rx="4" class="chip"/></g>
  <g transform="translate(530 296)"><rect width="100" height="92" rx="10" class="box"/><text x="50" y="30" class="dpt">Paperwork</text><rect x="12" y="44" width="76" height="8" rx="4" class="chip"/><rect x="12" y="58" width="64" height="8" rx="4" class="chip"/><rect x="12" y="72" width="44" height="8" rx="4" class="chip"/></g>
  <g transform="translate(655 296)"><rect width="100" height="92" rx="10" class="box"/><text x="50" y="30" class="dpt">Pets</text><rect x="12" y="44" width="56" height="8" rx="4" class="chip"/><rect x="12" y="58" width="76" height="8" rx="4" class="chip"/><rect x="12" y="72" width="60" height="8" rx="4" class="chip"/></g>
  <g transform="translate(780 296)"><rect width="100" height="92" rx="10" class="box good"/><text x="50" y="30" class="dpt g">Good Life</text><text x="50" y="62" class="tiny g">always on</text><text x="50" y="80" class="tiny">one thing to look forward to</text></g>
  <path d="M140 342h25 M265 342h25 M390 342h20 M510 342h20 M630 342h25 M755 342h25" class="dots"/>
  <text x="40" y="412" class="tiny" text-anchor="start">bars in each department: goals · work in progress · roadmap</text>
</svg>
