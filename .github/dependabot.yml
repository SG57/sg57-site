# Dependabot version updates. Weekly and grouped so a week of bumps is one pull request per group, and a
# cooldown so a brand-new release is not proposed until it has had time to be yanked or fixed.
# cooldown: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# (not applied to security updates, which still arrive immediately). Every bump runs the quality job in
# .github/workflows/deploy.yml (gates, then the rendered qa spine) before it can be merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      quality-tooling:
        patterns:
          - "@playwright/*"
          - "@axe-core/*"
          - "playwright*"
          - "stylelint*"
          - "html-validate"
          - "postcss-html"
          - "typescript"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
